name: Copia de la base de datos

# RNF-05, P-67: todas las noches a las 3:00 a. m. de Colombia (8:00 UTC), y a mano desde la pestaña
# Actions. Solo corre cuando la variable COPIAS_ACTIVAS del repositorio vale "true" (se activa al
# terminar la guía de despliegue, docs/despliegue.md).
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: copia-base
  cancel-in-progress: false

jobs:
  copiar:
    name: Copiar la base a R2
    if: vars.COPIAS_ACTIVAS == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Instalar el cliente de PostgreSQL 16
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16

      - name: Copiar
        env:
          COPIA_DB_URL: ${{ secrets.COPIA_DB_URL }}
          COPIAS_BUCKET: ${{ vars.COPIAS_BUCKET }}
          S3_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PG_DUMP: /usr/lib/postgresql/16/bin/pg_dump
        run: scripts/copias/copia-base.sh
