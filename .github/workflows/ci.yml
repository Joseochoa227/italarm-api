name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Compilar, analizar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Spotless, Checkstyle, pruebas unitarias e integración (Testcontainers), ArchUnit y JaCoCo.
      - name: Verificar
        run: ./mvnw -B verify

      - name: Publicar contrato OpenAPI
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openapi
          path: target/openapi.json
          if-no-files-found: warn

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: target/site/jacoco/
          if-no-files-found: warn

  imagen:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: verificar
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Construir
        run: docker build -t italarm-api:${{ github.sha }} .

      - name: Verificar el contenido de la imagen
        run: |
          docker run --rm --entrypoint java italarm-api:${{ github.sha }} -version
          # El HEALTHCHECK de la imagen usa curl.
          docker run --rm --entrypoint curl italarm-api:${{ github.sha }} --version
          docker run --rm --entrypoint id italarm-api:${{ github.sha }} -u | grep -qx 10001
