name: Copia de los archivos

# RNF-05, P-67: fotos, logo y facturas, cada domingo a las 4:00 a. m. de Colombia (9:00 UTC), y a
# mano desde la pestaña Actions. Solo corre con la variable COPIAS_ACTIVAS en "true".
on:
  schedule:
    - cron: "0 9 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: copia-archivos
  cancel-in-progress: false

jobs:
  copiar:
    name: Copiar los archivos a R2
    if: vars.COPIAS_ACTIVAS == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Copiar
        env:
          ARCHIVOS_BUCKET: ${{ vars.ARCHIVOS_BUCKET }}
          COPIAS_BUCKET: ${{ vars.COPIAS_BUCKET }}
          S3_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: scripts/copias/copia-archivos.sh
