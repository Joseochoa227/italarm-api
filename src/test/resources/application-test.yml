# Pruebas: la conexión a PostgreSQL la entrega Testcontainers (@ServiceConnection).
spring:
  datasource:
    url: jdbc:postgresql://reemplazada-por-testcontainers/italarm

italarm:
  cors:
    origenes: https://app.italarm.test
  usuarios:
    # Valor ficticio solo para pruebas; no es la contraseña real.
    clave-inicial: PruebaInicial1
  almacenamiento:
    carpeta: target/almacenamiento-pruebas
    clave-enlaces: clave-de-pruebas
  trm:
    # En las pruebas la TRM nunca se consulta en internet.
    programada: false
    al-arrancar: false
    url: http://localhost:1/sin-conexion

springdoc:
  # El controlador de pruebas de errores no forma parte del contrato.
  paths-to-exclude: /api/v1/_pruebas/**
