spring:
  application:
    name: italarm-api
  profiles:
    default: local
  datasource:
    url: ${ITALARM_DB_URL}
    username: ${ITALARM_DB_USUARIO}
    password: ${ITALARM_DB_CLAVE}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo manda Flyway, nunca Hibernate (BP-18).
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  mvc:
    problemdetails:
      enabled: false

server:
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

italarm:
  cors:
    origenes: ${ITALARM_CORS_ORIGENES:http://localhost:5173}
  usuarios:
    # Contraseña inicial para los usuarios que aún no tienen una (P-01). Solo desde el entorno.
    clave-inicial: ${ITALARM_CLAVE_INICIAL:}
