spring:
  application:
    name: italarm-api
  profiles:
    default: local
  datasource:
    url: ${ITALARM_DB_URL}
    username: ${ITALARM_DB_USUARIO}
    password: ${ITALARM_DB_CLAVE}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo manda Flyway, nunca Hibernate (BP-18).
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  mvc:
    problemdetails:
      enabled: false
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  servlet:
    multipart:
      # Las imágenes se validan a 5 MB (P-16); este límite corta antes las peticiones muy grandes.
      max-file-size: 6MB
      max-request-size: 6MB

server:
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json
  writer-with-order-by-keys: true

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

italarm:
  cors:
    origenes: ${ITALARM_CORS_ORIGENES:http://localhost:5173}
  usuarios:
    # Contraseña inicial para los usuarios que aún no tienen una (P-01). Solo desde el entorno.
    clave-inicial: ${ITALARM_CLAVE_INICIAL:}
  almacenamiento:
    tipo: ${ITALARM_ALMACENAMIENTO:disco}
    carpeta: ${ITALARM_ALMACENAMIENTO_CARPETA:./almacenamiento}
    url-publica: ${ITALARM_URL_PUBLICA:http://localhost:8080}
    clave-enlaces: ${ITALARM_ENLACES_CLAVE:}
    s3:
      endpoint: ${ITALARM_S3_ENDPOINT:}
      region: ${ITALARM_S3_REGION:auto}
      bucket: ${ITALARM_S3_BUCKET:}
      access-key: ${ITALARM_S3_ACCESS_KEY:}
      secret-key: ${ITALARM_S3_SECRET_KEY:}
  trm:
    url: ${ITALARM_TRM_URL:https://www.datos.gov.co/resource/32sa-8pi3.json}
