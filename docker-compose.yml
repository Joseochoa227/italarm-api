# Base de datos para desarrollo local. Uso: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: italarm-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-italarm}
      POSTGRES_USER: ${POSTGRES_USER:-italarm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  datos-postgres:
